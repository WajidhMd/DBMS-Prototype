<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce DBMS Portal</title>
  <meta name="description" content="Database Management Systems course project prototype portal.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <main class="auth-card" id="authCard">
    <div class="auth-header">
      <div class="auth-logo" id="appLogo">DBMS</div>
      <h1 class="auth-title">E-Commerce DBMS Portal</h1>
      <p class="auth-subtitle">Database Management Systems Project</p>
    </div>

    <!-- Alert Banner -->
    <div id="authAlert" class="alert-banner alert-danger" style="display: none;" role="alert">
      <span>Invalid username or password. Please try again.</span>
    </div>

    <form id="loginForm" autocomplete="off" onsubmit="handleLogin(event)">
      
      <!-- Target Database Selection -->
      <div class="db-engine-selector">
        <label class="selector-label">Target Database</label>
        <div class="db-grid">
          <div class="db-radio-card">
            <input type="radio" name="db_engine" id="db_mysql" value="MySQL" checked>
            <label for="db_mysql" class="db-card-label">
              <span class="db-name">MySQL</span>
            </label>
          </div>
          <div class="db-radio-card">
            <input type="radio" name="db_engine" id="db_postgres" value="PostgreSQL">
            <label for="db_postgres" class="db-card-label">
              <span class="db-name">PostgreSQL</span>
            </label>
          </div>
          <div class="db-radio-card">
            <input type="radio" name="db_engine" id="db_mongo" value="MongoDB">
            <label for="db_mongo" class="db-card-label">
              <span class="db-name">MongoDB</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label for="usernameInput" class="form-label">Username</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="usernameInput" 
            class="form-input" 
            placeholder="e.g. admin_sarah"
            required
          >
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="passwordInput" class="form-label">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            class="form-input" 
            placeholder="Enter password"
            required
          >
          <button type="button" class="password-toggle" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="Toggle password visibility">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        Login to Dashboard
      </button>

      <!-- Quick Demo Login Accounts -->
      <div class="demo-drawer-toggle">
        <button type="button" class="btn-drawer-open" onclick="toggleDemoDrawer(true)">
          View Sample User Accounts
        </button>
      </div>

    </form>
  </main>

  <!-- Sample Test Accounts Drawer -->
  <div class="demo-drawer" id="demoDrawer" onclick="if(event.target === this) toggleDemoDrawer(false)">
    <div class="demo-drawer-content">
      <div class="drawer-header">
        <h2 class="drawer-title">Sample User Accounts</h2>
        <button type="button" class="btn-close" onclick="toggleDemoDrawer(false)">✕</button>
      </div>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">
        Click any account below to autofill login details:
      </p>

      <div class="demo-users-list" id="demoUsersList">
        <!-- Injected by app.js -->
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAuthPage();
    });
  </script>
</body>
</html>
